name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # macos-14 is the minimum supported system. The status-item gesture has a
    # code path specific to newer releases, so the newest runner is tested too.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build
        run: swift build

      - name: Run unit tests
        run: swift test --enable-code-coverage

      - name: Report line coverage
        run: ./Scripts/coverage-summary.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Test release validator
        run: ./Scripts/test-validate-release.sh

      - name: Build the universal app bundle
        run: ./Scripts/build-app.sh

      - name: Verify architectures, icon, and ad-hoc signature
        run: |
          executable="dist/Drag Timer.app/Contents/MacOS/DragTimer"
          test "$(lipo -archs "$executable" | tr ' ' '\n' | sort | tr '\n' ' ' | sed 's/ $//')" = "arm64 x86_64"
          test -s "dist/Drag Timer.app/Contents/Resources/AppIcon.icns"
          codesign --verify --deep --strict --verbose=2 "dist/Drag Timer.app"
          test "$(codesign --display --verbose=2 "dist/Drag Timer.app" 2>&1 | sed -n 's/^Signature=//p')" = "adhoc"
